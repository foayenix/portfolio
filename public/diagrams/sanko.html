<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanko — architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;620&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* The portfolio's own tokens, copied from app/globals.css. */
  :root {
    --paper: #e6e5df; --paper-hi: #f2f1ec; --ink: #12233d; --ink-2: #4e5c72;
    --rule: #c6c5bb; --flo: #e0316b; --flo-deep: #c0184f;
    --accent-tint: rgba(224, 49, 107, 0.09);
    --zone: rgba(18, 35, 61, 0.025); --zone-rule: rgba(18, 35, 61, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; } }
  :root[data-theme='dark'] { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); padding: 18px 16px 22px; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { display: block; width: 100%; height: auto; }
  .eyebrow { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em;
             text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.01em; margin: 0 0 14px; line-height: 1.3; }
  figcaption { margin-top: 14px; max-width: 78ch; font-size: 13px; line-height: 1.62; color: var(--ink-2);
               border-top: 1px solid var(--rule); padding-top: 10px; }
  figcaption b { color: var(--ink); font-weight: 500; }
  .n { font-size: 13px; font-weight: 620; fill: var(--ink); }
  .s { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink-2); }
  .z { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
       text-transform: uppercase; fill: var(--ink-2); }
  .a { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink-2); }
</style>

<script>
  // The page is framed by the site, which cannot reach inside to set a theme,
  // so the frame asks for one in the query string. Without it the page follows
  // the reader's own system setting, which is the right answer on its own.
  (function () {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') document.documentElement.setAttribute('data-theme', want);
    } catch (e) {}
  })();
</script>

<figure>
  <p class="eyebrow">Sanko</p>
  <h1>The scoping is a query predicate in the executor, because a prompt is a request and a predicate is not.</h1>

  <svg viewBox="0 0 960 640" role="img" aria-label="A message arrives either from the WhatsApp Cloud API, where the pilot is blocked on a Meta production number, or from a browser simulator running the same agent loop. Intake turns text, a voice note or a photograph into the same content blocks using local Whisper and vision servers. A tool-calling loop with twenty-two tools runs over them, with Ollama by default and Anthropic as the alternative. Every executor resolves records by short code scoped to the calling practitioner, so an invented code returns not found rather than another practitioner’s patient. Records and media go to Supabase. The evaluation set makes no model call until a hundred cases carry a practitioner’s approval.">

<path d="M170,172 V200" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M732,394 V428" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>

<text class="a" x="186" y="184" text-anchor="start">same runAgent()</text>
<text class="a" x="300" y="238" text-anchor="start">text, voice note or photo</text>

<text class="a" x="712" y="572" text-anchor="start">approved cases</text>

      <rect x="64" y="96" width="212" height="76" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="n" x="80" y="120" fill="var(--ink-2)">WhatsApp Cloud API</text>
      <text class="s" x="80" y="138">the pilot, blocked on a</text>
      <text class="s" x="80" y="156">Meta production number</text>

      <text class="n" x="80" y="224">Browser simulator</text>
      <text class="s" x="80" y="242">the same agent loop, with</text>

      <text class="s" x="588" y="470">152 Nigerian plant names → botanical Latin</text>

      <text class="n" x="80" y="356">An invented FM-00042</text>
      <text class="s" x="80" y="374">comes back “not found”, never</text>
      <text class="s" x="80" y="392">another practitioner’s patient</text>

      <rect x="340" y="548" width="280" height="76" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="n" x="356" y="572" fill="var(--ink-2)">Evaluation set</text>
      <text class="s" x="356" y="590">makes no model call until a hundred</text>
      <text class="s" x="356" y="608">cases carry a practitioner’s approval</text>
  </svg>

  <figcaption>The two outlined boxes are one mechanism and its consequence. The agent has no keywords and no fixed steps, so it can produce a plausible record code and ask for it — and the scoping that stops that is a <b>query predicate in the executor</b>, not an instruction in the prompt, because a prompt is a request and a predicate is not. The evaluation set is drawn dashed on purpose: it exists and it has not run, and it will not run until a hundred cases carry a practitioner’s approval.</figcaption>
</figure>
