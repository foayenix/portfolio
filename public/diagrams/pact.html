<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pact · architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;620&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* The portfolio's own tokens, copied from app/globals.css. */
  :root {
    --paper: #e6e5df; --paper-hi: #f2f1ec; --ink: #12233d; --ink-2: #4e5c72;
    --rule: #c6c5bb; --flo: #e0316b; --flo-deep: #c0184f;
    --accent-tint: rgba(224, 49, 107, 0.09);
    --zone: rgba(18, 35, 61, 0.025); --zone-rule: rgba(18, 35, 61, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; } }
  :root[data-theme='dark'] { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); padding: 18px 16px 22px; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { display: block; width: 100%; height: auto; }
  .eyebrow { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em;
             text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.01em; margin: 0 0 14px; line-height: 1.3; }
  figcaption { margin-top: 14px; max-width: 78ch; font-size: 13px; line-height: 1.62; color: var(--ink-2);
               border-top: 1px solid var(--rule); padding-top: 10px; }
  figcaption b { color: var(--ink); font-weight: 500; }
  .n { font-size: 13px; font-weight: 620; fill: var(--ink); }
  .s { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink-2); }
  .z { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
       text-transform: uppercase; fill: var(--ink-2); }
  .a { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink-2); }
</style>

<script>
  // The page is framed by the site, which cannot reach inside to set a theme,
  // so the frame asks for one in the query string. Without it the page follows
  // the reader's own system setting, which is the right answer on its own.
  (function () {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') document.documentElement.setAttribute('data-theme', want);
    } catch (e) {}
  })();
</script>

<figure>
  <p class="eyebrow">Pact</p>
  <h1>An agreement has a state, and the signed version of it never changes.</h1>

  <svg viewBox="0 0 960 560" role="img" aria-label="An author writes an agreement in plain words and a counterparty reviews, negotiates and signs it from a private link with nothing installed. The agreement moves through draft, review, signed, active and complete, and every change in review arrives as a diff with a name on it. Agreement Check flags what is missing and what is unclear without claiming the agreement is valid. An amendment is a new version alongside the signed one rather than an edit of it.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2)"/>
      </marker>
      <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--flo-deep)"/>
      </marker>
    </defs>

      <rect x="40" y="64" width="260" height="216" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="52" y="58" width="97" height="12" fill="var(--paper)"/>
      <text class="z" x="58" y="68">Who touches it</text>

      <rect x="544" y="64" width="376" height="436" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="556" y="58" width="219" height="12" fill="var(--paper)"/>
      <text class="z" x="562" y="68">The agreement, one state at a time</text>
<path d="M276,122 H508 Q516,122 516,114 V112 Q516,104 524,104 H572" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M276,222 H484 Q492,222 492,214 V190 Q492,182 500,182 H572" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M732,142 V162" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M732,220 V240" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M732,316 V354" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow-a)"/>
<path d="M732,412 V432" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M300,350 H372 Q380,350 380,342 V204 Q380,196 388,196 H572" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M300,470 H412 Q420,470 420,462 V398 Q420,390 428,390 H572" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="a" x="304" y="114" text-anchor="start">writes it in plain words</text>
<text class="a" x="306" y="500" text-anchor="start">added beside the signed version</text>

      <rect x="64" y="96" width="212" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="120">The author</text>
      <text class="s" x="80" y="138">no template, no legal form</text>

      <rect x="64" y="184" width="212" height="94" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="208">The counterparty</text>
      <text class="s" x="80" y="226">reviews, negotiates and</text>
      <text class="s" x="80" y="244">signs from a private link.</text>
      <text class="s" x="80" y="262">Nothing to install</text>

      <rect x="40" y="320" width="260" height="94" rx="6" fill="var(--accent-tint)" stroke="var(--flo-deep)" stroke-width="1.4"/>
      <text class="n" x="56" y="344">Agreement Check</text>
      <text class="s" x="56" y="362">flags what is missing and what</text>
      <text class="s" x="56" y="380">is unclear. It never says the</text>
      <text class="s" x="56" y="398">agreement is valid</text>

      <rect x="40" y="440" width="260" height="76" rx="6" fill="var(--accent-tint)" stroke="var(--flo-deep)" stroke-width="1.4"/>
      <text class="n" x="56" y="464">Amendments</text>
      <text class="s" x="56" y="482">a new version alongside, never</text>
      <text class="s" x="56" y="500">an edit of the signed one</text>

      <rect x="572" y="84" width="320" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="108">Draft</text>
      <text class="s" x="588" y="126">plain language, no clauses yet</text>

      <rect x="572" y="162" width="320" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="186">Review</text>
      <text class="s" x="588" y="204">every change is a diff with a name on it</text>

      <rect x="572" y="240" width="320" height="76" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="264">Signed</text>
      <text class="s" x="588" y="282">both sides, from the same link. This version</text>
      <text class="s" x="588" y="300">is the one that never changes again</text>

      <rect x="572" y="354" width="320" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="378">Active</text>
      <text class="s" x="588" y="396">what each side owes, and what has been done</text>

      <rect x="572" y="432" width="320" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="456">Complete</text>
      <text class="s" x="588" y="474">with its evidence attached</text>
  </svg>

  <figcaption>The spine on the right is the product: the state of an agreement is legible without reading the document. Two boxes carry the rest. <b>Agreement Check</b> raises completeness and clarity warnings and stops short of implying legal validity, which is the line a tool like this has to hold. And an <b>amendment</b> is added beside the signed version rather than over it, so what both sides actually signed is still there to read.</figcaption>
</figure>
