<script>
  // The page is framed by the site, which cannot reach inside to set a theme,
  // so the frame asks for one in the query string. Without it the page follows
  // the reader's own system setting, which is the right answer on its own.
  (function () {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') document.documentElement.setAttribute('data-theme', want);
    } catch (e) {}
  })();
</script>

  <figcaption>Heritage schools in this field look unserious to anyone with a science background, and academic ones have no reason to exist. Holding both is the brief, and it is carried by the right-hand column rather than by the prose: hours anyone can count, clinical placement with a handbook behind it, and an <b>external examiner</b> named in a quality-assurance document. The pages then do the thing most schools in this space leave out, which is to say on the page what an award <b>does not</b> confer.</figcaption>
