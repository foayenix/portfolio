<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quire · architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;620&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* The portfolio's own tokens, copied from app/globals.css. */
  :root {
    --paper: #e6e5df; --paper-hi: #f2f1ec; --ink: #12233d; --ink-2: #4e5c72;
    --rule: #c6c5bb; --flo: #e0316b; --flo-deep: #c0184f;
    --accent-tint: rgba(224, 49, 107, 0.09);
    --zone: rgba(18, 35, 61, 0.025); --zone-rule: rgba(18, 35, 61, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; } }
  :root[data-theme='dark'] { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); padding: 18px 16px 22px; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { display: block; width: 100%; height: auto; }
  .eyebrow { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em;
             text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.01em; margin: 0 0 14px; line-height: 1.3; }
  figcaption { margin-top: 14px; max-width: 78ch; font-size: 13px; line-height: 1.62; color: var(--ink-2);
               border-top: 1px solid var(--rule); padding-top: 10px; }
  figcaption b { color: var(--ink); font-weight: 500; }
  .n { font-size: 13px; font-weight: 620; fill: var(--ink); }
  .s { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink-2); }
  .z { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
       text-transform: uppercase; fill: var(--ink-2); }
  .a { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink-2); }
</style>

<script>
  // The page is framed by the site, which cannot reach inside to set a theme,
  // so the frame asks for one in the query string. Without it the page follows
  // the reader's own system setting, which is the right answer on its own.
  (function () {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') document.documentElement.setAttribute('data-theme', want);
    } catch (e) {}
  })();
</script>

<figure>
  <p class="eyebrow">Quire</p>
  <h1>Everything is on one machine, and the drag that makes a citation is the only way to make one.</h1>

  <svg viewBox="0 0 960 548" role="img" aria-label="Sources, highlights and the draft sit on one canvas. A pdf.js reader produces highlights that are stable references into a source. Dragging a thread from a highlight onto a sentence resolves to that passage and becomes an inline footnote. The library is held in IndexedDB in the browser, with an optional local Ollama model beside it, and exports go out to .docx, LaTeX and PDF. Sync, sharing and collaboration are not built.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2)"/>
      </marker>
      <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--flo-deep)"/>
      </marker>
    </defs>

      <rect x="40" y="64" width="400" height="416" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="52" y="58" width="293" height="12" fill="var(--paper)"/>
      <text class="z" x="58" y="68">One browser profile · one machine · no account</text>

      <rect x="600" y="64" width="320" height="204" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="612" y="58" width="30" height="12" fill="var(--paper)"/>
      <text class="z" x="618" y="68">Out</text>
<path d="M244,156 V200" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M244,278 V322" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow-a)"/>
<path d="M424,236 H512 Q520,236 520,228 V120 Q520,112 528,112 H600" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M424,368 H500 Q508,368 508,360 V214 Q508,206 516,206 H600" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M416,404 H512 Q520,404 520,396 V368 Q520,360 528,360 H600" fill="none" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text class="a" x="260" y="186" text-anchor="start">highlight a passage</text>
<text class="a" x="260" y="308" text-anchor="start">drag a thread onto a sentence</text>

      <rect x="64" y="96" width="360" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="120">Canvas · React Flow</text>
      <text class="s" x="80" y="138">sources, highlights and the draft on one surface</text>

      <rect x="64" y="200" width="360" height="76" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="224">pdf.js reader and highlight layer</text>
      <text class="s" x="80" y="242">a highlight is a stable reference into the source,</text>
      <text class="s" x="80" y="260">and survives the source being moved or re-laid out</text>

      <rect x="64" y="322" width="360" height="76" rx="6" fill="var(--accent-tint)" stroke="var(--flo-deep)" stroke-width="1.4"/>
      <text class="n" x="80" y="346">The citation is the gesture</text>
      <text class="s" x="80" y="364">the drag resolves to that passage and becomes an</text>
      <text class="s" x="80" y="382">inline footnote. There is no second step to forget</text>

      <rect x="64" y="428" width="170" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="452">IndexedDB</text>
      <text class="s" x="80" y="470">the whole library</text>

      <rect x="254" y="428" width="170" height="58" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="n" x="270" y="452">Ollama · local</text>
      <text class="s" x="270" y="470">optional, local</text>

      <rect x="632" y="84" width="256" height="94" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="648" y="108">Exporters</text>
      <text class="s" x="648" y="126">.docx · LaTeX · PDF</text>
      <text class="s" x="648" y="144">three formats that each model</text>
      <text class="s" x="648" y="162">footnotes differently</text>

      <rect x="632" y="328" width="256" height="76" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="n" x="648" y="352" fill="var(--ink-2)">Sync, sharing, collaboration</text>
      <text class="s" x="648" y="370">not built. One profile, one</text>
      <text class="s" x="648" y="388">machine, one person</text>
  </svg>

  <figcaption>The outlined box is the whole design: the gesture <b>is</b> the citation, so there is no separate step that can be skipped or got wrong, and the thread has to survive the source being dragged across the canvas and still come out correct in three formats that each model footnotes differently. Everything else follows from keeping the library in the browser. It opens with no login and works with the network off, and it costs sync entirely, which is drawn here rather than left for someone to discover.</figcaption>
</figure>
