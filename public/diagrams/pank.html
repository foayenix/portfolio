<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pank · architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;620&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* The portfolio's own tokens, copied from app/globals.css. */
  :root {
    --paper: #e6e5df; --paper-hi: #f2f1ec; --ink: #12233d; --ink-2: #4e5c72;
    --rule: #c6c5bb; --flo: #e0316b; --flo-deep: #c0184f;
    --accent-tint: rgba(224, 49, 107, 0.09);
    --zone: rgba(18, 35, 61, 0.025); --zone-rule: rgba(18, 35, 61, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; } }
  :root[data-theme='dark'] { --paper: #0e1b2e; --paper-hi: #16273f; --ink: #e8e7e0; --ink-2: #93a2b8;
      --rule: #27394f; --flo: #ff5c8a; --flo-deep: #ff7ba1;
      --accent-tint: rgba(255, 92, 138, 0.12);
      --zone: rgba(232, 231, 224, 0.03); --zone-rule: rgba(232, 231, 224, 0.12);
      color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); padding: 18px 16px 22px; }
  figure { margin: 0 auto; max-width: 1000px; }
  svg { display: block; width: 100%; height: auto; }
  .eyebrow { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em;
             text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.01em; margin: 0 0 14px; line-height: 1.3; }
  figcaption { margin-top: 14px; max-width: 78ch; font-size: 13px; line-height: 1.62; color: var(--ink-2);
               border-top: 1px solid var(--rule); padding-top: 10px; }
  figcaption b { color: var(--ink); font-weight: 500; }
  .n { font-size: 13px; font-weight: 620; fill: var(--ink); }
  .s { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink-2); }
  .z { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
       text-transform: uppercase; fill: var(--ink-2); }
  .a { font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink-2); }
</style>

<script>
  // The page is framed by the site, which cannot reach inside to set a theme,
  // so the frame asks for one in the query string. Without it the page follows
  // the reader's own system setting, which is the right answer on its own.
  (function () {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') document.documentElement.setAttribute('data-theme', want);
    } catch (e) {}
  })();
</script>

<figure>
  <p class="eyebrow">Pank</p>
  <h1>A model may read a payslip. Nothing a model reads becomes a figure until you confirm it.</h1>

  <svg viewBox="0 0 960 620" role="img" aria-label="A single allowlisted owner signs in against a scrypt hash checked on every request; there is no sign-up page. One Next.js instance holds SQLite and the upload worker in the same process. An uploaded payslip is read by a model and shown beside the original for confirmation before any value counts. The forecast engine computes in integer pence on Europe/London dates, with no model producing an amount or a date. The database and the payslip originals live in DATA_DIR, outside the web root, and export, restore and delete all return to the owner. Moving money is not built.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2)"/>
      </marker>
      <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--flo-deep)"/>
      </marker>
    </defs>

      <rect x="40" y="64" width="260" height="200" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="52" y="58" width="177" height="12" fill="var(--paper)"/>
      <text class="z" x="58" y="68">One owner · no sign-up page</text>

      <rect x="544" y="64" width="376" height="428" rx="8" fill="var(--zone)" stroke="var(--zone-rule)" stroke-width="0.8"/>
      <rect x="556" y="58" width="171" height="12" fill="var(--paper)"/>
      <text class="z" x="562" y="68">One process · one instance</text>
<path d="M170,172 V200" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M276,232 H492 Q500,232 500,224 V120 Q500,112 508,112 H572" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M732,174 V214" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M732,308 V344" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow-a)"/>
<path d="M732,434 V470" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M572,500 H536 Q528,500 528,492 V204 Q528,196 520,196 H300" fill="none" stroke="var(--ink-2)" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="a" x="186" y="184" text-anchor="start">scrypt, checked every request</text>
<text class="a" x="300" y="226" text-anchor="start">typed figures and a payslip</text>
<text class="a" x="340" y="492" text-anchor="start">export · restore · delete</text>

      <rect x="64" y="96" width="212" height="76" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="120">The owner</text>
      <text class="s" x="80" y="138">one allowlisted address,</text>
      <text class="s" x="80" y="156">no way to create a second</text>

      <rect x="64" y="200" width="212" height="76" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="80" y="224">Session</text>
      <text class="s" x="80" y="242">document links are signed</text>
      <text class="s" x="80" y="260">and expire in five minutes</text>

      <rect x="572" y="84" width="320" height="58" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="108">Next.js 16 · one instance</text>
      <text class="s" x="588" y="126">SQLite and the upload worker share it</text>

      <rect x="572" y="214" width="320" height="94" rx="6" fill="var(--paper-hi)" stroke="var(--rule)" stroke-width="1"/>
      <text class="n" x="588" y="238">Payslip review</text>
      <text class="s" x="588" y="256">a model reads the upload, and what it read</text>
      <text class="s" x="588" y="274">is shown beside the original. Nothing it</text>
      <text class="s" x="588" y="292">extracted counts until you confirm it</text>

      <rect x="572" y="344" width="320" height="76" rx="6" fill="var(--accent-tint)" stroke="var(--flo-deep)" stroke-width="1.4"/>
      <text class="n" x="588" y="368">Forecast engine</text>
      <text class="s" x="588" y="386">integer pence, on Europe/London dates.</text>
      <text class="s" x="588" y="404">No model produces an amount or a date</text>

      <rect x="572" y="470" width="320" height="58" rx="6" fill="var(--accent-tint)" stroke="var(--flo-deep)" stroke-width="1.4"/>
      <text class="n" x="588" y="494">DATA_DIR · outside the web root</text>
      <text class="s" x="588" y="512">the database and the payslip originals</text>

      <rect x="340" y="536" width="280" height="76" rx="6" fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="n" x="356" y="560" fill="var(--ink-2)">Moving money</text>
      <text class="s" x="356" y="578">not built, and nothing on screen</text>
      <text class="s" x="356" y="596">implies it could be</text>
  </svg>

  <figcaption>The split across the middle is the point. A model is allowed in exactly one place, reading an uploaded payslip, and what it read is shown beside the image before it counts for anything. Everything downstream is <b>integer pence on London calendar dates</b>, so a forecast does not slide by a day across a clock change or lose a penny to a rounded division. The app records what you do and <b>never moves money</b>, which is drawn here as the absent box it is.</figcaption>
</figure>
